<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Portfolio Theme</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .container {
            background: white;
            color: #333;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        .button {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #c53030;
        }
        .success {
            color: #38a169;
            margin-top: 1rem;
        }
        .code {
            background: #f7fafc;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            margin: 1rem 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Reset Portfolio Theme</h1>
        <p>This will reset your portfolio to the default clean white theme with black text.</p>
        
        <button class="button" onclick="resetTheme()">Reset to Default Theme</button>
        
        <div id="result"></div>
        
        <div class="code">
            <strong>Alternative:</strong> Open browser console (F12) and run:
            <br><code>localStorage.clear(); location.reload();</code>
        </div>
        
        <p><small>After resetting, go back to your portfolio to see the clean default theme.</small></p>
    </div>

    <script>
        function resetTheme() {
            try {
                // Clear all portfolio-related localStorage items
                localStorage.removeItem('portfolio-theme-preferences');
                localStorage.removeItem('portfolio-user-initialized');
                localStorage.removeItem('customColors');
                
                // Show success message
                document.getElementById('result').innerHTML = 
                    '<div class="success">✅ Theme reset successfully! Please refresh your portfolio page to see the default theme.</div>';
                
                console.log('Portfolio theme reset to default');
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<div style="color: #e53e3e;">❌ Error: ' + error.message + '</div>';
                console.error('Failed to reset theme:', error);
            }
        }
    </script>
</body>
</html>
